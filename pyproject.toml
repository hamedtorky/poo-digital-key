[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdongle-digital-key"
version = "0.1.0"
description = "Encrypt files so they can only be decrypted with a LILYGO T-Dongle S3"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43,<46",
  "pyserial>=3.5,<4",
]

[project.scripts]
poo = "digital_key.cli:main"

[tool.setuptools.packages.find]
where = ["host"]

[tool.pytest.ini_options]
pythonpath = ["host"]
testpaths = ["tests"]
