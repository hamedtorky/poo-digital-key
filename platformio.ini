[platformio]
src_dir = firmware/src

[env:tdongle-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Use native USB bootloader flashing for ESP32-S3
upload_protocol = esp-builtin
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Preserve the existing flash partition layout and expose the onboard SD card
; as writable USB mass storage. T-Dongle S3 SDMMC pins are configured in
; firmware/src/usb_msc.cpp and can be overridden with build flags.
board_build.filesystem = fatfs
board_build.partitions = firmware/partitions.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
