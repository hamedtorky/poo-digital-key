services:
  sftp:
    build:
      context: .
    ports:
      - "127.0.0.1:${POO_SFTP_PORT:-2222}:22"
    volumes:
      - ./state/client_ed25519.pub:/etc/ssh/authorized_keys/poo:ro
      - sftp-data:/srv/sftp/files
      - sftp-vault-data:/srv/sftp/vault-v1
    restart: unless-stopped

volumes:
  sftp-data:
  sftp-vault-data:
